[server]
# Skip the first-run "enter your email" prompt in the terminal.
showEmailPrompt = false
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1f5c46"
backgroundColor = "#fbfbf9"
secondaryBackgroundColor = "#f3f2ee"
textColor = "#1a1a19"
linkColor = "#1f5c46"
borderColor = "#dedcd4"
dataframeBorderColor = "#e6e5df"
dataframeHeaderBackgroundColor = "#f3f2ee"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 15
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.sidebar]
backgroundColor = "#f3f2ee"
secondaryBackgroundColor = "#ffffff"
