[project]
name = "arbor"
version = "1.0.0"
description = "Interactive ID3 and C4.5 decision tree classification workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50,<2.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "graphviz>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
